name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check . --select F,E9,B --ignore B008,B023
      - name: Testes (SQLite)
        run: python -m pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medremind
          POSTGRES_PASSWORD: medremind
          POSTGRES_DB: medremind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medremind" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://medremind:medremind@localhost:5432/medremind
      TEST_DATABASE_URL: postgresql+psycopg://medremind:medremind@localhost:5432/medremind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-server.txt pytest
      - name: Migrações do Alembic aplicam do zero
        run: alembic upgrade head && alembic check
      - name: Testes do backend no PostgreSQL
        run: python -m pytest -q tests/test_backend.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagem do servidor compila
        run: docker build -t medremind-api .
