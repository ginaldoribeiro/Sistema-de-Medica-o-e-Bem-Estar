[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medremind"
version = "2.0.0"
description = "MedRemind — gestor de medicações com lembretes, estoque, hidratação e assistente com IA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["flet==1.0.4", "httpx>=0.27", "tzdata"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
          "psycopg[binary]>=3.2", "pyjwt>=2.8", "email-validator>=2.1"]
desktop = ["plyer>=2.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
medremind = "medremind.main:run"

# Configuração do `flet build apk|ipa|web|windows|macos|linux`
[tool.flet]
org = "br.com.medremind"
product = "MedRemind"
company = "MedRemind"
copyright = "Copyright (C) 2026 MedRemind"

[tool.flet.app]
path = "."
module = "main"

[tool.setuptools.packages.find]
include = ["medremind*", "backend*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
